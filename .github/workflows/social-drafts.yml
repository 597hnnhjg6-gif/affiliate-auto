name: Generate social content drafts
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate and validate drafts
        run: |
          python scripts/social_drafts.py
          python -c "import json; from pathlib import Path; p=json.loads(Path('social-output/latest.json').read_text(encoding='utf-8')); assert p['status']=='draft_only' and len(p['x']['text'])<=280"
      - name: Save downloadable drafts
        uses: actions/upload-artifact@v4
        with:
          name: social-drafts
          path: social-output/
          retention-days: 7
