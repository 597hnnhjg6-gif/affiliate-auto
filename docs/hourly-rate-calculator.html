<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="時給と労働時間から月収と年収の概算を計算します。 無料で使える計算ツールです。"><title>時給・月収換算ツール</title><style>body{font-family:system-ui;max-width:680px;margin:3em auto;padding:0 1em;line-height:1.7}input,button{font:inherit;padding:.5em;margin:.3em 0}label{display:block}.disclaimer{color:#555}</style></head><body><nav><a href="./index.html">トップへ</a></nav><h1>時給・月収換算ツール</h1><p>時給と労働時間から月収と年収の概算を計算します。</p><label>時給（円）<input id="x" type="number" step="any" required></label><label>月間労働時間<input id="y" type="number" step="any" required></label><button id="calculate">計算する</button><output id="result" aria-live="polite"></output><p class="disclaimer">計算結果は概算です。入力条件をご確認ください。</p><script>document.getElementById('calculate').addEventListener('click',()=>{try{document.getElementById('result').textContent=(()=>{const a=+x.value,b=+y.value;if(a<0||b<0||!Number.isFinite(a)||!Number.isFinite(b))throw Error("0以上の数値を入力してください");return "月収 "+Math.round(a*b).toLocaleString()+"円 / 年収 "+Math.round(a*b*12).toLocaleString()+"円";})()}catch(e){document.getElementById('result').textContent=e.message}})</script></body></html>
