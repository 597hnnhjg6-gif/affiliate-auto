<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="固定費・単価・変動費から必要販売数を計算します。 無料で使える計算ツールです。"><title>損益分岐点計算ツール</title><style>body{font-family:system-ui;max-width:680px;margin:3em auto;padding:0 1em;line-height:1.7}input,button{font:inherit;padding:.5em;margin:.3em 0}label{display:block}.disclaimer{color:#555}</style></head><body><nav><a href="./index.html">トップへ</a></nav><h1>損益分岐点計算ツール</h1><p>固定費・単価・変動費から必要販売数を計算します。</p><label>月間固定費（円）<input id="x" type="number" step="any" required></label><label>1件あたり限界利益（円）<input id="y" type="number" step="any" required></label><button id="calculate">計算する</button><output id="result" aria-live="polite"></output><p class="disclaimer">計算結果は概算です。入力条件をご確認ください。</p><script>document.getElementById('calculate').addEventListener('click',()=>{try{document.getElementById('result').textContent=(()=>{const a=+x.value,b=+y.value;if(a<0||b<=0||!Number.isFinite(a)||!Number.isFinite(b))throw Error("固定費は0以上、限界利益は0より大きく入力してください");return "必要販売数 "+Math.ceil(a/b).toLocaleString()+"件";})()}catch(e){document.getElementById('result').textContent=e.message}})</script></body></html>
