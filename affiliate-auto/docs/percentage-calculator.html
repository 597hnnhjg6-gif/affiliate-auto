<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>割合・増減率計算ツール</title><style>body{font-family:system-ui;max-width:680px;margin:3em auto;padding:0 1em;line-height:1.7}input,button{font:inherit;padding:.5em;margin:.3em 0}label{display:block}.disclaimer{color:#555}</style></head><body><nav><a href="./index.html">トップへ</a></nav><h1>割合・増減率計算ツール</h1><p>元の値と新しい値から増減率を計算します。</p><label>元の値<input id="x" type="number" step="any" required></label><label>新しい値<input id="y" type="number" step="any" required></label><button id="calculate">計算する</button><output id="result" aria-live="polite"></output><p class="disclaimer">計算結果は概算です。入力条件をご確認ください。</p><script>document.getElementById('calculate').addEventListener('click',()=>{try{document.getElementById('result').textContent=(()=>{const a=+x.value,b=+y.value;if(!Number.isFinite(a)||!Number.isFinite(b)||a===0)throw Error("元の値は0以外で入力してください");return ((b-a)/Math.abs(a)*100).toFixed(2)+"%";})()}catch(e){document.getElementById('result').textContent=e.message}})</script></body></html>
